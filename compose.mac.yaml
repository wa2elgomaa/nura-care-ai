# =============================================================================
# Mac M4 Max Development Environment Override
#
# Usage:
#   docker compose -f compose.yaml -f compose.mac.yaml --env-file .env --profile ai --profile app up -d
#
# Optimizations:
#   - Native Ollama on macOS (Metal GPU, 128GB RAM) for best performance
#   - Multi-instance VLM deployment (4 parallel instances)
#   - MLX/llama.cpp support for future optimization
#   - Development-friendly settings
# =============================================================================
name: nura

services:
  # ---------------------------------------------------------------------------
  # VLM Optimization: Multi-instance deployment for M4 Max
  # ---------------------------------------------------------------------------

  # Primary VLM instance (existing)
  nura-vlm:
    build:
      context: ./services/nura-vlm
      dockerfile: Dockerfile.mac
    environment:
      OLLAMA_URL: http://host.docker.internal:11434  # Native Ollama on Mac
      VLM_MODEL: ${VLM_MODEL:-llava:7b}
      VLM_TEMPERATURE: ${VLM_TEMPERATURE:-0.3}
      VLM_MAX_TOKENS: ${VLM_MAX_TOKENS:-500}
      VLM_TIMEOUT: ${VLM_TIMEOUT:-180}
      ENABLE_METAL: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"  # Expose primary VLM instance
    networks:
      - core_net  # Internal service communication
      - lan_net   # External access for testing
    # Override depends_on to remove ollama dependency (runs natively on Mac)
    depends_on:
      - nats
    # No GPU passthrough needed - Ollama runs natively

  # Additional VLM instances for parallel processing
  nura-vlm-2:
    profiles: [ "app", "vlm-parallel" ]
    build:
      context: ./services/nura-vlm
      dockerfile: Dockerfile.mac
    image: ${NURA_VLM_IMAGE:-nura/vlm:dev}
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      VLM_MODEL: ${VLM_MODEL:-llava:7b}
      VLM_TEMPERATURE: ${VLM_TEMPERATURE:-0.3}
      VLM_MAX_TOKENS: ${VLM_MAX_TOKENS:-500}
      VLM_TIMEOUT: ${VLM_TIMEOUT:-180}
      ENABLE_METAL: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8001"
    networks: [ core_net ]
    depends_on:
      - nats

  nura-vlm-3:
    profiles: [ "app", "vlm-parallel" ]
    build:
      context: ./services/nura-vlm
      dockerfile: Dockerfile.mac
    image: ${NURA_VLM_IMAGE:-nura/vlm:dev}
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      VLM_MODEL: ${VLM_MODEL:-llava:7b}
      VLM_TEMPERATURE: ${VLM_TEMPERATURE:-0.3}
      VLM_MAX_TOKENS: ${VLM_MAX_TOKENS:-500}
      VLM_TIMEOUT: ${VLM_TIMEOUT:-180}
      ENABLE_METAL: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8001"
    networks: [ core_net ]
    depends_on:
      - nats

  nura-vlm-4:
    profiles: [ "app", "vlm-parallel" ]
    build:
      context: ./services/nura-vlm
      dockerfile: Dockerfile.mac
    image: ${NURA_VLM_IMAGE:-nura/vlm:dev}
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      VLM_MODEL: ${VLM_MODEL:-llava:7b}
      VLM_TEMPERATURE: ${VLM_TEMPERATURE:-0.3}
      VLM_MAX_TOKENS: ${VLM_MAX_TOKENS:-500}
      VLM_TIMEOUT: ${VLM_TIMEOUT:-180}
      ENABLE_METAL: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8004:8001"
    networks: [ core_net ]
    depends_on:
      - nats

  # ---------------------------------------------------------------------------
  # Load Balancer for Multi-Instance VLM
  # ---------------------------------------------------------------------------
  nura-vlm-lb:
    profiles: [ "app", "vlm-parallel" ]
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./edge/nginx/vlm-upstream.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    networks: [ core_net ]
    depends_on:
      - nura-vlm
      - nura-vlm-2
      - nura-vlm-3
      - nura-vlm-4

  # ---------------------------------------------------------------------------
  # Rules service updated to use load balancer when parallel mode enabled
  # ---------------------------------------------------------------------------
  nura-rules:
    environment:
      VLM_SERVICE_URL: http://nura-vlm-lb:80  # Load balancer for parallel instances

  # ---------------------------------------------------------------------------
  # Ollama: Placeholder for native macOS installation
  # ---------------------------------------------------------------------------
  # The Mac version uses native Ollama instead of containerized
  # This is a placeholder to satisfy dependencies in compose.yaml
  ollama:
    image: alpine:latest  # Minimal image with shell
    restart: "no"
    networks: [ core_net ]
    command: ["/bin/sh", "-c", "echo 'Native Ollama running on macOS at host.docker.internal:11434' && sleep infinity"]
    # Override the profile from base compose to make it always available
    profiles: ["app"]  # Match app profile so it starts with nura-vlm
    # This service does nothing - native Ollama runs on macOS at host.docker.internal:11434

  # Native Ollama Setup (REQUIRED):
  #   brew install ollama
  #   ollama serve
  #   ollama pull llava:7b
  # Benefits:
  #   - Direct Metal GPU access (no virtualization overhead)
  #   - Full 128GB RAM available
  #   - 2-6x faster than Docker
  #   - Automatic M4 Max optimization

  # ---------------------------------------------------------------------------
  # Development optimizations for Mac
  # ---------------------------------------------------------------------------
  postgres:
    # M4 Max has plenty of RAM - increase shared buffers
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=32GB
      - -c
      - work_mem=128MB
      - -c
      - maintenance_work_mem=512MB

  nura-rag:
    environment:
      # Use native macOS transformers.js with Metal acceleration if available
      USE_NATIVE_EMBEDDINGS: "true"
      EMBEDDING_BATCH_SIZE: "32"  # M4 Max can handle larger batches

  nura-perception:
    # M4 Max Neural Engine available for CoreML models
    environment:
      USE_COREML: "true"
      DETECTION_BATCH_SIZE: "8"

# =============================================================================
# Mac Development Notes
# =============================================================================
#
# Setup Instructions:
# 1. Install native Ollama: brew install ollama
# 2. Start Ollama: ollama serve
# 3. Pull model: ollama pull llava:7b
# 4. Start services: docker compose -f compose.yaml -f compose.mac.yaml --env-file .env --profile ai --profile app up -d
# 5. For parallel VLM: add --profile vlm-parallel
#
# Performance Expectations:
# - Single VLM instance: 30-60s per image (2-6x speedup)
# - 4 parallel instances: 2-8 FPS aggregate (10-20 cameras @ 1 FPS)
# - With MLX optimization (future): 0.5-1.0s per image (100-360x speedup)
#
# M4 Max Advantages:
# - 128GB Unified Memory (shared CPU/GPU/Neural Engine)
# - Metal GPU: 546 GB/s bandwidth
# - Neural Engine: 38 TOPS for CoreML models
# - 16 CPU cores (12P + 4E)
# - No CUDA/virtualization overhead
#
# Future Optimizations:
# - MLX-VLM integration when library issues fixed
# - llama.cpp with Metal GPU
# - CoreML fast path for supervision detection
# - Hybrid architecture (70% fast path + 30% VLM)
#
# =============================================================================
