events {
    worker_connections 1024;
}

http {
    # VLM Load Balancer
    # Round-robin across 4 VLM instances for parallel processing

    upstream vlm_backend {
        # Round-robin load balancing (default)
        # Each request goes to the next server in rotation

        server nura-vlm:8001 max_fails=3 fail_timeout=30s;
        server nura-vlm-2:8001 max_fails=3 fail_timeout=30s;
        server nura-vlm-3:8001 max_fails=3 fail_timeout=30s;
        server nura-vlm-4:8001 max_fails=3 fail_timeout=30s;

        # Health checks: mark server down after 3 failures for 30s
        # Connections distribute evenly across healthy instances
    }

    server {
        listen 80;
        server_name vlm-lb;

        # VLM inference endpoint
        location /analyze {
            proxy_pass http://vlm_backend;

            # Long timeout for VLM processing (up to 3 minutes)
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No buffering for real-time responses
            proxy_buffering off;

            # Large body size for image uploads (up to 10MB)
            client_max_body_size 10M;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://vlm_backend;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Status page showing upstream health
        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }

    # Logging
    access_log /var/log/nginx/vlm_access.log;
    error_log /var/log/nginx/vlm_error.log warn;
}
