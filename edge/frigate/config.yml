# Frigate config for testing with local video file
mqtt:
  host: mosquitto
  port: 1883

detectors:
  cpu1:
    type: cpu
    num_threads: 3

cameras:
  classroom_test:
    enabled: true
    ffmpeg:
      inputs:
        - path: /media/frigate/classroom_6.mp4
          input_args: -re -stream_loop -1 -fflags +genpts
          roles: [detect]
    detect:
      enabled: true
      width: 1920
      height: 1080
      fps: 5
    objects:
      track:
        - person
      filters:
        person:
          min_area: 1000
          threshold: 0.3
    record:
      enabled: false
    snapshots:
      enabled: true
      timestamp: false
      bounding_box: true
version: 0.18-0
