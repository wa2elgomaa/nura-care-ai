# Starter config. Adjust keys to your Frigate version (detector and auth settings
# have changed between releases).
mqtt:
  host: mosquitto
  port: 1883

detectors:
  cpu1:
    type: cpu
    num_threads: 3

go2rtc:
  streams:
    room1:
      - rtsp://sim-cam:8554/room1

cameras:
  room1:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/room1   # go2rtc restream inside Frigate
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      width: 1280
      height: 720
      fps: 5
    objects:
      track: [person]
    record:
      enabled: false
    snapshots:
      enabled: true
